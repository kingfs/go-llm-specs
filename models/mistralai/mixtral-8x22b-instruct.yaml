  - 出色的数学、编程与推理能力
  - 超长上下文长度（64k）
  - 流利支持英语、法语、意大利语、德语和西班牙语

  基准测试结果详见发布公告：[此处](https://mistral.ai/news/mixtral-8x22b/)。
