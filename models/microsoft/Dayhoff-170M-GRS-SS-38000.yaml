description: Dayhoff is a protein language model using a hybrid state-space Mamba and Transformer architecture with Mixture-of-Experts. It is trained on 3.34 billion protein sequences and supports unconditional design, zero-shot mutation effect prediction, and scaffold design.
description_cn: Dayhoff 是一种蛋白质语言模型，采用结合 Mamba 与 Transformer 的混合状态空间架构及混合专家（MoE）机制。该模型基于 33.4 亿条蛋白质序列训练，支持无条件生成、零样本突变效应预测及支架设计。
