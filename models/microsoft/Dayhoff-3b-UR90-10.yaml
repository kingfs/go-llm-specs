description: Dayhoff is a protein language model with a hybrid of state-space Mamba layers and Transformer self-attention, interleaved with Mixture-of-Experts modules. It is trained on 3.34 billion protein sequences and supports zero-shot mutation effect prediction and scaffold design.
description_cn: Dayhoff 是一种蛋白质语言模型，混合了状态空间 Mamba 层与 Transformer 自注意力机制，并交错使用混合专家模块。该模型基于 33.4 亿条蛋白质序列训练，支持零样本突变效应预测及支架设计。
