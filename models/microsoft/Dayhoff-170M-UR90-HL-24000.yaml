description: Dayhoff is a hybrid state-space Mamba and Transformer self-attention architecture with Mixture-of-Experts modules. It is trained for protein sequence generation, mutation effect prediction, and scaffold design. The model supports long contexts and order-agnostic infilling via autoregressive training in N→C and C→N directions.
description_cn: Dayhoff 采用 Mamba 混合状态空间和 Transformer 自注意力架构，并集成分布式专家混合（MoE）模块。它专为蛋白质序列生成、突变效应预测和支架设计而训练。该模型支持长上下文，并通过 N→C 和 C→N 方向的自回归训练实现顺序无关的填充能力。
