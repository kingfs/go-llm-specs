description: Dayhoff is a hybrid state-space Mamba and Transformer self-attention model with Mixture-of-Experts modules for protein sequence generation. It supports zero-shot mutation effect prediction, scaffold design, and guided generation. Trained on the Dayhoff Atlas protein data.
