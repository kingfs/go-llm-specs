id: anthropic/claude-opus-4.8-fast
name: 'Anthropic: Claude Opus 4.8 (Fast)'
provider: Anthropic
description: |-
  Fast-mode variant of [Opus 4.8](/anthropic/claude-opus-4.8) - identical capabilities with higher output speed at 2x pricing relative to regular Opus 4.8.

  Learn more in Anthropic's docs: https://platform.claude.com/docs/en/build-with-claude/fast-mode
description_cn: |-
  [Opus 4.8](/anthropic/claude-opus-4.8) 的快速模式变体 - 具有相同的能力，但输出速度更快，价格是常规 Opus 4.8 的两倍。

  在 Anthropic 的文档中了解更多信息：https://platform.claude.com/docs/en/build-with-claude/fast-mode
context_length: 1000000
max_output: 128000
features:
  - CapChat
  - CapFunctionCall
  - CapJsonMode
  - ModalityFileIn
  - ModalityImageIn
  - ModalityTextIn
  - ModalityTextOut
