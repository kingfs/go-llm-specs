id: openai/gpt-5.6-sol-pro
name: 'OpenAI: GPT-5.6 Sol Pro'
provider: OpenAI
description: |-
  GPT-5.6 Sol Pro is the same underlying model as [GPT-5.6 Sol](https://openrouter.ai/openai/gpt-5.6-sol), served with `reasoning.mode` set to `pro` for higher-quality responses on complex tasks.

  Learn more in OpenAI's docs: https://developers.openai.com/api/docs/guides/reasoning#reasoning-mode
description_cn: |-
  GPT-5.6 Sol Pro与[GPT-5.6 Sol](https://openrouter.ai/openai/gpt-5.6-sol)具有相同的基础模型，`reasoning.mode`设置为`pro`，可在复杂任务中提供更高质量的响应。

  详细信息请查看OpenAI文档： https://developers.openai.com/api/docs/guides/reasoning#reasoning-mode
context_length: 1050000
max_output: 128000
features:
  - CapChat
  - CapFunctionCall
  - CapJsonMode
  - ModalityFileIn
  - ModalityImageIn
  - ModalityTextIn
  - ModalityTextOut
