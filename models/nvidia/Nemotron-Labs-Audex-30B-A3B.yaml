description: Nemotron-Labs-Audex-30B-A3B is a unified audio-text LLM based on Nemotron-Cascade-2-30B-A3B, extending vocabulary for audio tokens and using an audio encoder. It supports audio understanding, speech recognition, translation, TTS, audio generation, and speech-to-speech, operating in thinking and instruct modes.
description_cn: Nemotron-Labs-Audex-30B-A3B 是一款基于 Nemotron-Cascade-2-30B-A3B 的统一音频-文本大语言模型，扩展了音频 token 的词表并使用音频编码器。它支持音频理解、语音识别、翻译、TTS、音频生成和语音到语音转换，支持思考和指令模式。
