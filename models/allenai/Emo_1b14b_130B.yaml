description: A smaller-scale ablation checkpoint of EMO, a 1B-active / 14B-total parameter Mixture-of-Experts model. It features 128 experts (127 routed + 1 shared) with k=8 active per token, pretrained on 130B tokens using the EMO document-level expert pool constraint.
description_cn: EMO 的小规模消融检查点，这是一款 1B 活跃/14B 总参数的混合专家（MoE）模型。它拥有 128 个专家（127 个路由专家 + 1 个共享专家），每个词元激活 k=8 个专家，基于 EMO 文档级专家池约束在 130B 词元上预训练。
