description: MolmoMotion is a 4B vision-language model that forecasts 3D point trajectories under natural-language action instructions. Given a short RGB observation history, a set of user-specified 2D query points with their 3D history, and an action description, it predicts where those points move in 3D (camera frame, in meters) over a future horizon.
description_cn: MolmoMotion 是一个 4B 视觉-语言模型，能够在自然语言动作指令下预测 3D 点轨迹。给定一段短的 RGB 观察历史、一组用户指定的带有 3D 历史的 2D 查询点以及动作描述，它会在未来的时间跨度内预测（相对于相机的米制单位）这些点的运动位置。
