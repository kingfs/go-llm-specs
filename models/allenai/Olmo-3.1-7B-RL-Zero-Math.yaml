description_cn: Olmo 3.1 7B RL-Zero Math 是由艾伦人工智能研究所开发的一个实验性 7B 参数 Transformer 自回归语言模型。该模型基于 Dolci-RL-Zero-Math-7B 数据集，通过可验证奖励的强化学习（RLVR）进行后训练，以提升数学等推理任务的能力。
