description: A 1B-active / 14B-total parameter Mixture-of-Experts model with 128 experts (127 routed + 1 shared, k=8 active per token). Pretrained on 1T tokens of the OLMoE mix, then annealed for 50B tokens under EMO constraints.
description_cn: 12 亿激活/140 亿总参数的混合专家（MoE）模型，拥有 128 个专家（127 个路由专家 + 1 个共享专家，每 token 激活 k=8 个）。在 1 万亿 OLMoE 混合 token 上预训练，随后在 EMO 约束下进行 500 亿 token 的退火训练。
