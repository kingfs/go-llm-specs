description: StdMoE_1b14b_1T_Preanneal is a 1B-active/14B-total parameter Mixture-of-Experts model, serving as the pre-annealing baseline for the EMO experiment. It uses 128 experts (127 routed, 1 shared) with k=8 active per token, pretrained on 1T tokens of the OLMoE mix without annealing.
description_cn: StdMoE_1b14b_1T_Preanneal 是一个 12 亿激活/140 亿总参数的混合专家（MoE）模型，作为 EMO 实验的预退火基线。它使用 128 个专家（127 个路由，1 个共享），每 token 激活 k=8 个，在 1 万亿 OLMoE 混合 token 上预训练，未进行退火。
