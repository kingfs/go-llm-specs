description: A memory-matched standard Mixture-of-Experts baseline model with 1B active and 4B total parameters, consisting of 32 routed experts and 1 shared expert with k=8 active experts per token. It was pretrained from scratch on 130B tokens of the OLMoE pretraining mix.
description_cn: 一款内存匹配的标准化混合专家（MoE）基线模型，具有 1B 活跃参数和 4B 总参数，包含 32 个路由专家和 1 个共享专家，每个词元激活 k=8 个专家。它在 OLMoE 预训练混合数据的 130B 词元上从头预训练。
