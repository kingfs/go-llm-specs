description: GLM-5 is a large language model with 744B parameters (40B active), scaled from GLM-4.5's 355B (32B active). It integrates DeepSeek Sparse Attention (DSA) to reduce deployment costs while preserving long-context capacity. It targets complex systems engineering and long-horizon agentic tasks, achieving best-in-class open-source performance on reasoning, coding, and agentic benchmarks.
description_cn: GLM-5 是一个拥有 744B 参数（40B 激活）的大语言模型，由 GLM-4.5 的 355B（32B 激活）规模扩展而来。该模型集成了 DeepSeek 稀疏注意力（DSA）机制，在保持长上下文能力的同时降低部署成本。其面向复杂的系统工程和多步智能体任务，在推理、编码及智能体基准测试中取得了开源模型中最佳的性能表现。
