description: GLM-4.1V-9B-Thinking is a vision-language model designed to enhance reasoning capabilities. It achieves state-of-the-art performance among 10B-parameter VLMs, matching or surpassing 72B models on 18 benchmarks. It supports bilingual Chinese and English usage.
description_cn: GLM-4.1V-9B-Thinking 是一款旨在增强推理能力的视觉语言模型。在 100 亿参数规模的 VLM 中，其性能达到行业领先水平，在 18 个基准测试中匹敌甚至超越了 720 亿参数的模型。该模型支持中英双语使用。
