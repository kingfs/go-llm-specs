schema_version: 1
id: google
name: Google
aliases: [Google DeepMind]
official:
  homepage: https://deepmind.google/
  documentation: https://ai.google.dev/gemini-api/docs/models
  model_catalog: https://ai.google.dev/gemini-api/docs/models
organizations:
  huggingface: [google]
discovery:
  huggingface: true
identity:
  strategy: publisher
  require_corroboration: true
  official_api:
    url: https://generativelanguage.googleapis.com/v1beta/models
    env: GEMINI_API_KEY
    auth: query
    query_param: key
    items_path: models
    id_field: name
    id_prefix: models/
