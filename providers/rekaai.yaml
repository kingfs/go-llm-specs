# Reka publishes from the RekaAI organization, whose name also forms its
# OpenRouter prefix, so the provider id matches the records already in the
# catalog and "reka" is kept as an alias for the other spelling.
schema_version: 1
id: rekaai
name: Reka AI
kind: company
official:
  homepage: https://www.reka.ai/
  model_catalog: https://huggingface.co/RekaAI
organizations:
  huggingface: [RekaAI]
aliases: [reka]
discovery:
  huggingface: true
identity:
  strategy: publisher
  require_corroboration: true
