schema_version: 1
families:
  - name: qwen-3.5-and-newer
    id_pattern: '^qwen/qwen3\.([5-9]|[1-9][0-9]).*'
    require_hugging_face: true
    slug_strategies: [huggingface_id, registry_id, model_suffix]
  - name: deepseek-v3-r1-and-newer
    id_pattern: '^deepseek/deepseek-((chat-)?v(3|[4-9]|[1-9][0-9]).*|r([1-9]|[1-9][0-9]).*)'
    require_hugging_face: true
    slug_strategies: [huggingface_id, registry_id, model_suffix]
  - name: glm-5-and-newer
    id_pattern: '^z-ai/glm-([5-9]|[1-9][0-9]).*'
    require_hugging_face: true
    slug_strategies: [huggingface_id, registry_id, model_suffix]
  - name: kimi-k2.7-and-newer
    id_pattern: '^moonshotai/kimi-(k2\.([7-9]|[1-9][0-9]).*|k([3-9]|[1-9][0-9]).*)'
    require_hugging_face: true
    slug_strategies: [huggingface_id, registry_id, model_suffix]
