name: Daily Model Sync

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT || 'none' }}
    concurrency:
      group: daily-model-sync
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      models: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      released: ${{ steps.releasecheck.outputs.release_needed }}
      release_ref: ${{ steps.releasecheck.outputs.next_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Refresh upstream registry
        run: task generator -- -use-cache-fallback=false

      - name: Discover releases from subscribed official Hugging Face organizations
        run: task catalog-discover

      - name: Refresh OpenRouter-attributed structured facts from the immutable cache
        run: task enrich -- -source openrouter -new-only=false

      - name: Enrich only models missing official Hugging Face structured facts
        run: task enrich -- -source huggingface -new-only -failure-report data/enrichment-failures.json

      - name: Extract a bounded batch of new model-card suggestions
        if: env.LLM_API_KEY != ''
        continue-on-error: true
        env:
          LLM_WIRE_API: chat
          CARD_EXTRACT_LIMIT: '5'
          CARD_EXTRACT_MAX_CHARS: '8000'
          CARD_EXTRACT_DELAY: '2'
        run: task cardextract-batch

      - name: Apply safe high-confidence official model-card claims
        run: task suggestion -- auto-apply

      - name: Promote fully enriched official candidates
        run: task catalog-promote

      - name: Translate missing Chinese descriptions
        if: env.LLM_API_KEY != ''
        continue-on-error: true
        run: task translator -- -limit 10

      - name: Report disabled AI enrichment
        if: env.LLM_API_KEY == ''
        run: echo "::warning::AI enrichment and translation are disabled; configure the LLM_API_KEY secret and optional LLM_BASE_URL / LLM_MODEL variables."

      - name: Regenerate compiled registry after translation
        run: task generator-offline

      - name: Regenerate Codex catalog after translation
        run: task codexgen

      - name: Validate enriched registry and generated artifacts
        run: |
          task catalog-audit
          task lint
          task test
          task build
          task codexgen -- -validate

      - name: Check for synced changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- models/ providers/ models_gen.go data/models.json data/catalog-audit.json data/catalog-discovery.json data/enrichment-failures.json data/suggestions/ dist/codex/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.146.0

      - name: Load catalog through pinned Codex CLI
        run: task codexcheck

      - name: Evaluate release necessity
        if: steps.changes.outputs.changed == 'true'
        id: releasecheck
        run: |
          task releasecheck -- -github-output "$GITHUB_OUTPUT" -format text > /tmp/releasecheck.txt
          cat /tmp/releasecheck.txt

      - name: Commit and push synced data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models_gen.go data/models.json data/catalog-audit.json data/catalog-discovery.json data/enrichment-failures.json data/suggestions/ models/ providers/ dist/codex/
          git commit -m "feat(data): sync upstream model registry"
          git push

      - name: Create release for upstream changes
        if: steps.releasecheck.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releasecheck.outputs.next_tag }}
          name: Release ${{ steps.releasecheck.outputs.next_tag }}
          body: ${{ steps.releasecheck.outputs.release_body }}
          files: dist/codex/third-party-models.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages-after-sync:
    needs: sync-upstream
    if: needs.sync-upstream.outputs.released == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.sync-upstream.outputs.release_ref }}
    permissions:
      contents: read
      pages: write
      id-token: write

  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install Task and pinned Codex CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm install --global @openai/codex@0.146.0
      - name: Validate repository and Codex catalog
        run: |
          task ci
          task codexcheck

  release-from-push:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.releasecheck.outputs.release_needed }}
      release_ref: ${{ steps.releasecheck.outputs.next_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        run: |
          task lint
          task test
          task fmt
          task build
          task codexgen -- -validate

      - name: Install pinned Codex CLI and load catalog
        run: |
          npm install --global @openai/codex@0.146.0
          task codexcheck

      - name: Evaluate release necessity
        id: releasecheck
        run: |
          task releasecheck -- -github-output "$GITHUB_OUTPUT" -format text > /tmp/releasecheck.txt
          cat /tmp/releasecheck.txt

      - name: Create release for pushed metadata updates
        if: steps.releasecheck.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releasecheck.outputs.next_tag }}
          name: Release ${{ steps.releasecheck.outputs.next_tag }}
          body: ${{ steps.releasecheck.outputs.release_body }}
          files: dist/codex/third-party-models.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages-after-push-release:
    needs: release-from-push
    if: needs.release-from-push.outputs.released == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release-from-push.outputs.release_ref }}
    permissions:
      contents: read
      pages: write
      id-token: write
