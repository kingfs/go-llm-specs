name: Daily Model Sync

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      release_needed: ${{ steps.releasecheck.outputs.release_needed }}
      next_tag: ${{ steps.releasecheck.outputs.next_tag }}
      release_body: ${{ steps.releasecheck.outputs.release_body }}
      release_summary: ${{ steps.releasecheck.outputs.release_summary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Refresh upstream registry
        run: task generator

      - name: Enrich new models from structured sources
        run: task enrich -- -new-only

      - name: Generate Codex model catalog
        run: task codexgen

      - name: Check for upstream changes
        id: upstream_changes
        run: |
          if git diff --quiet -- models/ models_gen.go data/models.json dist/codex/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Translate missing Chinese descriptions
        if: steps.upstream_changes.outputs.changed == 'true'
        env:
          LLM_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: https://models.github.ai/inference
          LLM_MODEL: openai/gpt-4o-mini
        run: task translator

      - name: Regenerate compiled registry after translation
        if: steps.upstream_changes.outputs.changed == 'true'
        run: task generator

      - name: Regenerate Codex catalog after translation
        if: steps.upstream_changes.outputs.changed == 'true'
        run: task codexgen

      - name: Check for synced changes
        id: changes
        run: |
          if git diff --quiet -- models/ models_gen.go data/models.json dist/codex/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate enriched registry and generated artifacts
        run: |
          task lint
          task test
          task build
          task codexgen -- -validate

      - name: Evaluate release necessity
        id: releasecheck
        run: |
          task releasecheck -- -github-output "$GITHUB_OUTPUT" -format text > /tmp/releasecheck.txt
          cat /tmp/releasecheck.txt

      - name: Commit and push synced data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models_gen.go data/models.json models/ dist/codex/
          git commit -m "feat(data): sync upstream model registry [skip ci]"
          git push

      - name: Create release for upstream changes
        if: steps.releasecheck.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releasecheck.outputs.next_tag }}
          name: Release ${{ steps.releasecheck.outputs.next_tag }}
          body: ${{ steps.releasecheck.outputs.release_body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-from-push:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        run: |
          task lint
          task test
          task fmt
          task build
          task codexgen -- -validate

      - name: Evaluate release necessity
        id: releasecheck
        run: |
          task releasecheck -- -github-output "$GITHUB_OUTPUT" -format text > /tmp/releasecheck.txt
          cat /tmp/releasecheck.txt

      - name: Create release for pushed metadata updates
        if: steps.releasecheck.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releasecheck.outputs.next_tag }}
          name: Release ${{ steps.releasecheck.outputs.next_tag }}
          body: ${{ steps.releasecheck.outputs.release_body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
