name: Daily Model Sync

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: daily-model-sync
      cancel-in-progress: false
    permissions:
      contents: write
      models: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Refresh upstream registry
        run: task generator

      - name: Enrich new models from structured sources
        run: task enrich -- -new-only

      - name: Extract a bounded batch of new model-card suggestions
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: https://models.github.ai/inference
          LLM_MODEL: openai/gpt-4o-mini
          LLM_WIRE_API: chat
          CARD_EXTRACT_LIMIT: '5'
          CARD_EXTRACT_MAX_CHARS: '8000'
          CARD_EXTRACT_DELAY: '2'
        run: task cardextract-batch

      - name: Generate Codex model catalog
        run: task codexgen

      - name: Check for upstream changes
        id: upstream_changes
        run: |
          if git diff --quiet -- models/ models_gen.go data/models.json data/suggestions/ dist/codex/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Translate missing Chinese descriptions
        if: steps.upstream_changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: https://models.github.ai/inference
          LLM_MODEL: openai/gpt-4o-mini
        run: task translator -- -limit 10

      - name: Regenerate compiled registry after translation
        if: steps.upstream_changes.outputs.changed == 'true'
        run: task generator

      - name: Regenerate Codex catalog after translation
        if: steps.upstream_changes.outputs.changed == 'true'
        run: task codexgen

      - name: Check for synced changes
        id: changes
        run: |
          if git diff --quiet -- models/ models_gen.go data/models.json data/suggestions/ dist/codex/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate enriched registry and generated artifacts
        run: |
          task lint
          task test
          task build
          task codexgen -- -validate

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.146.0

      - name: Load catalog through pinned Codex CLI
        run: task codexcheck

      - name: Evaluate release necessity
        if: steps.changes.outputs.changed == 'true'
        id: releasecheck
        run: |
          task releasecheck -- -github-output "$GITHUB_OUTPUT" -format text > /tmp/releasecheck.txt
          cat /tmp/releasecheck.txt

      - name: Commit and push synced data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models_gen.go data/models.json data/suggestions/ models/ dist/codex/
          git commit -m "feat(data): sync upstream model registry [skip ci]"
          git push

      - name: Create release for upstream changes
        if: steps.releasecheck.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releasecheck.outputs.next_tag }}
          name: Release ${{ steps.releasecheck.outputs.next_tag }}
          body: ${{ steps.releasecheck.outputs.release_body }}
          files: dist/codex/third-party-models.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install Task and pinned Codex CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm install --global @openai/codex@0.146.0
      - name: Validate repository and Codex catalog
        run: |
          task ci
          task codexcheck

  release-from-push:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        run: |
          task lint
          task test
          task fmt
          task build
          task codexgen -- -validate

      - name: Install pinned Codex CLI and load catalog
        run: |
          npm install --global @openai/codex@0.146.0
          task codexcheck

      - name: Evaluate release necessity
        id: releasecheck
        run: |
          task releasecheck -- -github-output "$GITHUB_OUTPUT" -format text > /tmp/releasecheck.txt
          cat /tmp/releasecheck.txt

      - name: Create release for pushed metadata updates
        if: steps.releasecheck.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releasecheck.outputs.next_tag }}
          name: Release ${{ steps.releasecheck.outputs.next_tag }}
          body: ${{ steps.releasecheck.outputs.release_body }}
          files: dist/codex/third-party-models.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
