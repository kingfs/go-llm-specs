name: Model Museum Pages

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref containing the released catalog
        required: false
        type: string
  push:
    branches: [master]
    paths: [cmd/sitegen/**, docs/**, README.md, README_EN.md, .github/workflows/pages.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (defaults to master)
        required: false
        default: master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'master' }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build and validate static site
        run: |
          go test ./cmd/sitegen
          go run ./cmd/sitegen
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
