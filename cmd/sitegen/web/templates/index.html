<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="可搜索、可筛选的 LLM 模型能力目录，由 go-llm-specs 数据自动生成。">
  <meta property="og:title" content="LLM Model Museum">
  <meta property="og:description" content="Explore model context windows, modalities and capabilities.">
  <title>LLM Model Museum · go-llm-specs</title>
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/catalog.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="LLM Model Museum home"><span class="brand-mark">LLM</span><span>Model Museum</span></a>
    <nav>
      <a href="#catalog" data-i18n="catalog">模型目录</a>
      <a href="docs/about/" data-i18n="docs">项目文档</a>
      <a href="https://github.com/kingfs/go-llm-specs">GitHub</a>
      <button id="language" class="language" type="button" aria-label="Switch language">EN</button>
    </nav>
  </header>

  <main>
    <section class="summary" aria-label="Catalog summary">
      <div id="stats" class="stats" aria-live="polite"></div>
    </section>

    <section id="catalog" class="catalog-section">
      <div class="section-heading"><div><p class="eyebrow" data-i18n="explore">EXPLORE</p><h2 data-i18n="catalogTitle">模型目录</h2></div><p id="result-count" class="result-count"></p></div>
      <div class="controls">
        <label class="search"><span class="sr-only" data-i18n="searchLabel">搜索模型</span><input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="搜索模型、厂商、ID 或别名"></label>
        <select id="provider" aria-label="Provider"><option value="" data-i18n="allProviders">所有厂商</option></select>
        <select id="sort" aria-label="Sort models"><option value="recommended" data-i18n="sortRecommended">最新与权威厂商优先</option><option value="released" data-i18n="sortReleased">按发布时间排序</option><option value="authority" data-i18n="sortAuthority">按权威厂商排序</option><option value="context" data-i18n="sortContext">上下文从大到小</option><option value="output" data-i18n="sortOutput">最大输出从大到小</option><option value="name" data-i18n="sortName">按名称排序</option></select>
        <button id="clear" class="secondary" type="button" data-i18n="clear">清除筛选</button>
      </div>
      <div id="tag-filters" class="tag-filters" aria-label="Capability filters"></div>
      <div id="groups" class="groups" aria-live="polite"></div>
      <div id="empty" class="empty" hidden><h3 data-i18n="emptyTitle">没有匹配的模型</h3><p data-i18n="emptyCopy">尝试清除部分筛选条件或使用其他关键词。</p></div>
    </section>
  </main>
  <footer><span>go-llm-specs</span><span data-i18n="footer">静态数据，随每次发布自动更新</span></footer>
</body>
</html>
